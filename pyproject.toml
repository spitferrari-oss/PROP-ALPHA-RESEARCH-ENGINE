[project]
name = "prop-alpha-engine"
version = "0.1.0"
description = "Prop Alpha Research Engine — autonomous quantitative research and prop-optimization laboratory"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.9",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
databento = [
    "databento>=0.30",
]
gexbot = [
    "requests>=2.31",
]

[project.scripts]
pae = "prop_alpha.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, fully offline unit test (the default — most tests carry no marker at all, which is equivalent)",
    "integration: exercises multiple modules together (e.g. tests/test_integration_data_extension.py), still offline",
    "network: requires real outbound network access to run for real",
    "provider: exercises a real (not mocked/injected) vendor provider client",
    "live: connects to a live/streaming data feed or account",
    "slow: takes noticeably longer than the rest of the suite (e.g. Gaussian Mixture / combinatorial search tests)",
]
